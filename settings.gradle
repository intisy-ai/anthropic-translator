plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "anthropic-translator-java"

// :ir is basekit's neutral IR module, resolved by github-gradle from basekit's release assets.
// :annotations, :processor and :contract come from api the same way: :ir exports api's seam types
// in HandlerCtx's public fields and emits its own TypeScript, so any build including :ir must
// resolve api at the same coordinates.

// :anthropic       - the Anthropic translator + codecs (Java 8, zero-dep, TeaVM-clean).
// :teavm-anthropic - TeaVM JS export surface over :anthropic + :ir.
include ":anthropic"
include ":teavm-anthropic"
