rootProject.name = "anthropic-translator-java"

// :ir is core-ir's neutral IR module, reached via the nested core-ir submodule (path re-declared
// here, the ecosystem convention: Gradle settings do not nest, so every consumer re-declares it).
include ":ir"
project(":ir").projectDir = file("../core-ir/java/ir")

// :anthropic       - the Anthropic translator + codecs (Java 8, zero-dep, TeaVM-clean).
// :teavm-anthropic - TeaVM JS export surface over :anthropic + :ir.
include ":anthropic"
include ":teavm-anthropic"
